<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>遊び代管理</title>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, doc, getDoc, setDoc, enableIndexedDbPersistence }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyADydfhaPwCNBd_CO2c5qQM0ONmr-FTEZQ",
      authDomain: "kakeibo-21cf0.firebaseapp.com",
      projectId: "kakeibo-21cf0",
      storageBucket: "kakeibo-21cf0.firebasestorage.app",
      messagingSenderId: "558811122568",
      appId: "1:558811122568:web:4e08fca088a1eb9579483d",
      measurementId: "G-P1PX4Z9T3H"
    };

    const app      = initializeApp(firebaseConfig);
    const auth     = getAuth(app);
    const provider = new GoogleAuthProvider();
    const db       = getFirestore(app);

    // オフラインキャッシュを有効化
    enableIndexedDbPersistence(db).catch(() => {});

    // グローバルに公開
    window._auth     = auth;
    window._provider = provider;
    window._db       = db;
    window._doc      = doc;
    window._getDoc   = getDoc;
    window._setDoc   = setDoc;
    window._signInWithPopup    = signInWithPopup;
    window._signOut            = signOut;
    window._onAuthStateChanged = onAuthStateChanged;
  </script>

  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e8789a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="遊び代">

  <style>
    /* =====================================================
       CSS変数 & リセット
    ===================================================== */
    :root {
      --primary:       #e8789a;
      --primary-light: #fde8ef;
      --primary-dark:  #c45c7c;
      --green:         #6dbfa0;
      --orange:        #e89a6d;
      --red:           #e86d7a;
      --bg:            #fdf5f7;
      --card:          #ffffff;
      --text:          #3d2533;
      --text2:         #9e7a8a;
      --border:        #f5dde6;
      --tab-h:         68px;
      --safe-b:        env(safe-area-inset-bottom, 0px);
      --safe-t:        env(safe-area-inset-top, 44px);
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
    }

    /* =====================================================
       タブバー
    ===================================================== */
    .tab-bar {
      position: fixed;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 430px;
      height: calc(var(--tab-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5,1fr);
      z-index: 100;
    }

    .tab-btn {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px;
      background: none; border: none; cursor: pointer;
      color: var(--text2); font-size: 10px; font-weight: 600;
      padding: 8px 4px;
      transition: color .2s;
    }
    .tab-btn.active { color: var(--primary); }
    .tab-btn .ti { font-size: 22px; }

    /* =====================================================
       コンテンツエリア
    ===================================================== */
    .tab-content { display: none; min-height: 100dvh; padding-bottom: calc(var(--tab-h) + var(--safe-b) + 20px); }
    .tab-content.active { display: block; }

    .nav-bar {
      position: sticky; top: 0;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: calc(var(--safe-t) + 8px) 20px 14px;
      border-bottom: 1px solid var(--border);
      z-index: 50;
    }
    .nav-bar h1 { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }

    .content { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    /* =====================================================
       カード
    ===================================================== */
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 2px 14px rgba(0,0,0,.07);
    }

    /* =====================================================
       予算カード
    ===================================================== */
    .budget-card { text-align: center; }
    .month-lbl { font-size: 13px; color: var(--text2); margin-bottom: 6px; }
    .remaining-lbl { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
    .remaining-amt {
      font-size: 52px; font-weight: 900;
      letter-spacing: -3px; line-height: 1.1;
      margin-bottom: 20px;
      transition: color .3s;
    }
    .remaining-amt.green  { color: var(--green); }
    .remaining-amt.orange { color: var(--orange); }
    .remaining-amt.red    { color: var(--red); }

    .prog-track { background: #fdeef3; border-radius: 8px; height: 12px; overflow: hidden; margin-bottom: 8px; }
    .prog-fill  { height: 100%; border-radius: 8px; transition: width .5s cubic-bezier(.4,0,.2,1); }
    .prog-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); }

    .warning {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600;
      padding: 6px 14px; border-radius: 20px; margin-top: 12px;
    }
    .warning.orange { background: #fff7ed; color: #c2410c; }
    .warning.red    { background: #fef2f2; color: #b91c1c; }

    /* =====================================================
       カテゴリ別
    ===================================================== */
    .sec-title { font-size: 17px; font-weight: 700; margin-bottom: 12px; }

    .cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .cat-icon-sm {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .cat-name-sm { font-size: 13px; width: 62px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cat-bar-track { flex: 1; background: #fdeef3; border-radius: 4px; height: 8px; overflow: hidden; }
    .cat-bar-fill  { height: 100%; border-radius: 4px; transition: width .4s; }
    .cat-amount { font-size: 14px; font-weight: 700; width: 72px; text-align: right; flex-shrink: 0; }

    /* 予算設定済みカテゴリの表示 */
    .cat-row-budget { align-items: flex-start; }
    .cat-budget-info { flex: 1; min-width: 0; }
    .cat-budget-top {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 5px;
    }
    .cat-row-budget .cat-name-sm { width: auto; }
    .cat-row-budget .cat-amount { width: auto; }
    .cat-bdg-total { font-size: 11px; font-weight: 600; color: var(--text2); }
    .cat-bdg-status { font-size: 11px; color: var(--text2); margin-top: 4px; text-align: right; }

    /* =====================================================
       支出リスト
    ===================================================== */
    .expense-list { border-radius: 18px; overflow: hidden; background: white; box-shadow: 0 2px 12px rgba(0,0,0,.07); }
    .expense-item {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid #fdeef3;
    }
    .expense-item:last-child { border-bottom: none; }
    .exp-icon {
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .exp-info { flex: 1; min-width: 0; }
    .exp-cat  { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
    .exp-note { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .exp-date { font-size: 11px; color: #9ca3af; }
    .exp-amt  { font-size: 16px; font-weight: 800; flex-shrink: 0; }
    .del-btn  { background: none; border: none; color: #e86d7a; cursor: pointer; padding: 6px; font-size: 16px; flex-shrink: 0; }
    .expense-item { cursor: pointer; transition: background .15s; }
    .expense-item:active { background: #fef7f9; }
    .receipt-tag { font-size: 10px; background: #e0e7ff; color: #4338ca; padding: 1px 5px; border-radius: 4px; font-weight: 700; }

    .empty-state { text-align: center; padding: 48px 24px; color: var(--text2); }
    .empty-state .ei { font-size: 48px; opacity: .4; margin-bottom: 12px; }

    /* =====================================================
       フォーム
    ===================================================== */
    .form-sec { margin-bottom: 20px; }
    .form-lbl {
      font-size: 12px; font-weight: 700;
      color: var(--text2); text-transform: uppercase; letter-spacing: .5px;
      display: block; margin-bottom: 8px;
    }

    .amt-row {
      display: flex; align-items: center; gap: 4px;
      background: #fef7f9; border: 2px solid var(--border);
      border-radius: 14px; padding: 14px 16px;
      transition: border-color .2s;
    }
    .amt-row:focus-within { border-color: var(--primary); background: white; }
    .yen { font-size: 26px; font-weight: 900; }
    .amt-input {
      flex: 1; border: none; background: transparent;
      font-size: 30px; font-weight: 900; color: var(--text);
      outline: none; width: 100%;
    }
    .amt-input::placeholder { color: #d4b0bc; }

    .cat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .cat-btn {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 12px 6px; border: 2px solid transparent;
      border-radius: 16px; background: #fef7f9;
      cursor: pointer; font-size: 11px; font-weight: 600;
      color: var(--text2); transition: all .15s;
    }
    .cat-btn.sel { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .cat-btn-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }

    .txt-input {
      width: 100%; padding: 14px 16px;
      border: 2px solid var(--border); border-radius: 14px;
      font-size: 16px; outline: none;
      background: #fef7f9; color: var(--text);
      transition: border-color .2s;
      -webkit-appearance: none;
    }
    .txt-input:focus { border-color: var(--primary); background: white; }

    .primary-btn {
      width: 100%; padding: 16px;
      background: var(--primary); color: white;
      border: none; border-radius: 16px;
      font-size: 17px; font-weight: 800; cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    .primary-btn:disabled { background: #d1d5db; cursor: not-allowed; }
    .primary-btn:not(:disabled):active { transform: scale(.98); opacity: .9; }
    .outline-btn {
      width: 100%; padding: 15px;
      background: white; color: var(--primary);
      border: 2px solid var(--primary);
      border-radius: 16px; font-size: 17px; font-weight: 800;
      cursor: pointer; transition: all .15s;
    }
    .cancel-btn {
      width: 100%; padding: 15px;
      background: #f5dde6; color: #9e7a8a;
      border: none;
      border-radius: 16px; font-size: 17px; font-weight: 800;
      cursor: pointer; transition: all .15s;
    }
    .cancel-btn:active { background: #f0c8d8; }

    /* =====================================================
       レシートスキャナー
    ===================================================== */
    .receipt-preview {
      width: 100%; height: 210px;
      background: #fdeef3; border-radius: 18px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      position: relative; margin-bottom: 16px;
    }
    .receipt-preview img { width: 100%; height: 100%; object-fit: cover; }
    .receipt-ph { text-align: center; color: var(--text2); }
    .receipt-ph .ri { font-size: 48px; opacity: .35; margin-bottom: 8px; }

    .proc-overlay {
      position: absolute; inset: 0;
      background: rgba(255,255,255,.9);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      border-radius: 18px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #f5dde6;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .amt-choice-list { border-radius: 16px; overflow: hidden; border: 2px solid var(--border); }
    .amt-choice-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background .15s;
    }
    .amt-choice-item:last-child { border-bottom: none; }
    .amt-choice-item.sel { background: var(--primary-light); }
    .check {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; flex-shrink: 0;
    }
    .amt-choice-item.sel .check { background: var(--primary); border-color: var(--primary); color: white; }
    .choice-num { font-size: 22px; font-weight: 800; }

    #receipt-file { display: none; }

    /* =====================================================
       設定
    ===================================================== */
    .settings-row { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 8px rgba(0,0,0,.06); }
    .settings-item {
      display: flex; align-items: center; padding: 14px 16px;
      border-bottom: 1px solid var(--border); gap: 12px;
    }
    .settings-item:last-child { border-bottom: none; }
    .s-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .s-label { flex: 1; font-size: 16px; font-weight: 500; }
    .s-value { font-size: 14px; color: var(--text2); }
    .s-del { background: none; border: none; color: var(--red); cursor: pointer; padding: 6px; font-size: 18px; }

    /* =====================================================
       モーダル
    ===================================================== */
    .modal-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 200;
      align-items: flex-end;
    }
    .modal-bg.open { display: flex; }
    .modal-sheet {
      background: white;
      border-radius: 24px 24px 0 0;
      padding: 16px 20px 0;
      width: 100%; max-height: 90dvh; overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .modal-sheet-body {
      flex: 1; overflow-y: auto;
    }
    .modal-sheet-footer {
      padding: 12px 0 calc(20px + var(--safe-b));
      background: white;
      position: sticky; bottom: 0;
      display: flex; flex-direction: column; gap: 10px;
    }
    .modal-handle { width: 36px; height: 4px; background: #f5dde6; border-radius: 2px; margin: 0 auto 20px; }
    .modal-title  { font-size: 20px; font-weight: 800; margin-bottom: 20px; }

    /* アイコン・カラーグリッド */
    .icon-grid  { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; }
    .icon-opt {
      font-size: 26px; padding: 8px; border-radius: 12px;
      border: 2px solid transparent; background: #fdeef3;
      cursor: pointer; text-align: center; transition: all .15s;
    }
    .icon-opt.sel { border-color: var(--primary); background: var(--primary-light); }
    .color-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .color-opt {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid transparent; cursor: pointer;
      transition: transform .15s;
    }
    .color-opt.sel { border-color: #111; transform: scale(1.1); }

    /* =====================================================
       ログイン画面
    ===================================================== */
    #login-screen {
      display: none;
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #e8789a 0%, #c45c7c 100%);
      z-index: 1000;
      align-items: center; justify-content: center;
      flex-direction: column;
      padding: 40px 32px;
    }
    #login-screen.show { display: flex; }
    .login-logo { font-size: 64px; margin-bottom: 16px; }
    .login-icon-img {
      width: 100px; height: 100px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .login-title { font-size: 28px; font-weight: 900; color: white; margin-bottom: 8px; letter-spacing: -1px; }
    .login-sub   { font-size: 15px; color: rgba(255,255,255,.75); margin-bottom: 48px; text-align: center; }
    .login-catch  { font-size: 20px; font-weight: 800; color: white; margin-bottom: 12px; text-align: center; letter-spacing: .5px; text-shadow: 0 2px 8px rgba(0,0,0,.15); }
    .google-btn {
      display: flex; align-items: center; gap: 12px;
      background: white; color: #374151;
      border: none; border-radius: 16px;
      padding: 16px 28px; font-size: 16px; font-weight: 700;
      cursor: pointer; width: 100%; justify-content: center;
      box-shadow: 0 4px 24px rgba(0,0,0,.2);
      transition: transform .15s, box-shadow .15s;
    }
    .google-btn:active { transform: scale(.97); box-shadow: 0 2px 12px rgba(0,0,0,.2); }
    .google-icon { width: 24px; height: 24px; }
    .login-note { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 20px; text-align: center; }

    /* ナビバーのユーザーアバター */
    .nav-user {
      position: absolute; right: 16px; top: 50%;
      transform: translateY(-50%) translateY(calc(var(--safe-t) / 2));
      display: flex; align-items: center; gap: 8px;
    }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--primary-light);
    }
    .user-avatar-ph {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--primary-light); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800;
    }
    .logout-btn {
      background: none; border: none; color: var(--text2);
      font-size: 12px; cursor: pointer; padding: 4px 8px;
      border-radius: 8px; font-weight: 600;
    }
    .logout-btn:active { background: var(--bg); }

    /* =====================================================
       トースト
    ===================================================== */
    .toast {
      position: fixed;
      bottom: calc(var(--tab-h) + var(--safe-b) + 20px);
      left: 50%; transform: translateX(-50%) translateY(20px);
      background: white; border-radius: 30px;
      padding: 12px 24px;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,.15);
      font-size: 15px; font-weight: 700;
      opacity: 0; pointer-events: none;
      transition: opacity .3s, transform .3s;
      z-index: 300; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* =====================================================
       履歴・分析タブ
    ===================================================== */
    .month-selector {
      display: flex; align-items: center; justify-content: center;
      gap: 16px; margin-bottom: 16px;
    }
    .month-nav-btn {
      background: var(--primary-light); border: none; color: var(--primary);
      width: 36px; height: 36px; border-radius: 50%;
      font-size: 20px; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .month-nav-btn:disabled { opacity: .3; cursor: default; }
    .month-label-text { font-size: 18px; font-weight: 800; color: var(--text); min-width: 120px; text-align: center; }

    .history-summary-total { font-size: 32px; font-weight: 900; color: var(--primary); }
    .history-summary-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }

    .cat-breakdown-row {
      display: flex; flex-direction: column; gap: 4px;
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .cat-breakdown-row:last-child { border-bottom: none; }
    .cat-breakdown-top {
      display: flex; align-items: center; gap: 8px;
    }
    .cat-breakdown-icon {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .cat-breakdown-name { font-size: 14px; font-weight: 700; flex: 1; color: var(--text); }
    .cat-breakdown-amt  { font-size: 15px; font-weight: 800; color: var(--text); }
    .cat-breakdown-bar-wrap {
      height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-left: 36px;
    }
    .cat-breakdown-bar { height: 100%; border-radius: 3px; transition: width .4s; }
    .cat-breakdown-budget { font-size: 11px; color: var(--text2); margin-left: 36px; }
    .cat-budget-over { color: var(--red); font-weight: 700; }

    /* カテゴリ予算設定 */
    .cat-budget-row {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .cat-budget-row:last-child { border-bottom: none; }
    .cat-budget-icon {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .cat-budget-name { flex: 1; font-size: 14px; font-weight: 700; color: var(--text); }
    .cat-budget-input {
      width: 90px; padding: 6px 10px; border-radius: 10px;
      border: 2px solid var(--border); font-size: 14px; font-weight: 700;
      text-align: right; background: var(--bg); color: var(--text);
      -webkit-appearance: none;
    }
    .cat-budget-input:focus { border-color: var(--primary); background: white; outline: none; }

    /* =====================================================
       みーちゃん
    ===================================================== */
    #miichan-wrap {
      position: fixed;
      left: 16px;
      bottom: calc(var(--tab-h) + var(--safe-b) + 12px);
      z-index: 250;
      display: flex; flex-direction: column; align-items: flex-start;
      gap: 4px;
    }
    #miichan-svg {
      width: 84px; height: auto; cursor: pointer;
      filter: drop-shadow(0 4px 8px rgba(232,120,154,.25));
      transition: transform .2s;
    }
    #miichan-svg:active { transform: scale(.92); }
    @keyframes miibounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    #miichan-svg.bounce { animation: miibounce .5s ease; }
    .miichan-bubble {
      background: white;
      border: 2px solid var(--primary-light);
      border-radius: 14px 14px 14px 4px;
      padding: 8px 12px;
      font-size: 12px; font-weight: 700; color: var(--text);
      max-width: 180px; line-height: 1.4;
      box-shadow: 0 3px 12px rgba(232,120,154,.2);
      opacity: 0; transform: translateY(6px);
      transition: opacity .3s, transform .3s;
      pointer-events: none;
    }
    .miichan-bubble.show { opacity: 1; transform: translateY(0); }
  </style>

<!-- Tesseract.js (OCRエンジン) -->
<script src="https://unpkg.com/tesseract.js@4/dist/tesseract.min.js"></script>

<script>
/* ==================================================
   デフォルトデータ
================================================== */
const DEF_CATS = [
  { id:'c1', name:'食事',         icon:'🍜', color:'#e8789a' },
  { id:'c2', name:'エンタメ',     icon:'🎮', color:'#a78bca' },
  { id:'c3', name:'ショッピング', icon:'🛍️', color:'#7ab8d4' },
  { id:'c4', name:'カフェ',       icon:'☕', color:'#d4956e' },
  { id:'c5', name:'交通',         icon:'🚃', color:'#6dbfa0' },
  { id:'c6', name:'その他',       icon:'💬', color:'#c98fa8' },
];

const ICONS = ['🍜','🍣','🍔','🍺','🎮','🎬','🎵','📚',
               '🛍️','👗','☕','🏋️','⚽','🎨','✈️','🚃',
               '💊','🌸','🐾','💡','🎁','🏠','💻','🎯'];

const COLORS = ['#e8789a','#c45c7c','#a78bca','#7ab8d4','#6dbfa0',
                '#d4956e','#e8b06d','#c98fa8','#f2afc0','#9ab8d4'];

/* ==================================================
   状態管理
================================================== */
let S = { budget: 30000, expenses: [], categories: [...DEF_CATS], catBudgets: {} };
let currentUser = null;

function userDocRef() {
  return window._doc(window._db, 'users', currentUser.uid, 'data', 'state');
}

async function save() {
  // Firestore に保存
  try {
    await window._setDoc(userDocRef(), S);
  } catch(e) {
    console.warn('Firestore save failed, falling back to localStorage', e);
    localStorage.setItem('pb2_' + currentUser.uid, JSON.stringify(S));
  }
}

async function load() {
  S = { budget: 30000, expenses: [], categories: [...DEF_CATS], catBudgets: {} };
  try {
    const snap = await window._getDoc(userDocRef());
    if (snap.exists()) {
      S = { ...S, ...snap.data() };
    }
  } catch(e) {
    // オフライン時はlocalStorageにフォールバック
    console.warn('Firestore load failed, falling back to localStorage', e);
    try {
      const d = localStorage.getItem('pb2_' + currentUser.uid);
      if (d) S = { ...S, ...JSON.parse(d) };
    } catch(e2) {}
  }
}

/* ==================================================
   ヘルパー
================================================== */
const fmt = n => '¥' + Math.round(n).toLocaleString('ja-JP');

function thisMonthExpenses() {
  const now = new Date();
  return S.expenses
    .filter(e => {
      const d = new Date(e.date);
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    })
    .sort((a,b) => new Date(b.date) - new Date(a.date));
}

const totalSpent  = () => thisMonthExpenses().reduce((s,e) => s + e.amount, 0);
const remaining   = () => S.budget - totalSpent();
const usageRate   = () => S.budget > 0 ? Math.min(totalSpent() / S.budget, 1) : 0;
const getCat      = id => S.categories.find(c => c.id === id) || DEF_CATS[5];
const catSpent    = id => thisMonthExpenses().filter(e => e.categoryId === id).reduce((s,e) => s + e.amount, 0);
const colorClass  = r  => r < .5 ? 'green' : r < .8 ? 'orange' : 'red';
const gradient    = r  => r < .5 ? 'linear-gradient(90deg,#6dbfa0,#8fd4b8)'
                        : r < .8 ? 'linear-gradient(90deg,#e89a6d,#f0b48a)'
                        :          'linear-gradient(90deg,#e86d7a,#f08a95)';

function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function monthLabel() {
  const d = new Date();
  return `${d.getFullYear()}年${d.getMonth()+1}月`;
}

/* ==================================================
   タブ切替
================================================== */
function switchTab(t) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  document.getElementById('tb-'+t).classList.add('active');
  if (t==='home')     renderHome();
  if (t==='add')      renderAdd();
  if (t==='history')  renderHistory();
  if (t==='receipt')  renderReceipt();
  if (t==='settings') renderSettings();
}

/* ==================================================
   ホーム描画
================================================== */
function renderHome() {
  const rate = usageRate();
  const rem  = remaining();
  const spent = totalSpent();

  // 予算カード
  let warn = '';
  if (rate >= 1)   warn = `<div class="warning red">⚠️ 今月の予算を超えています！</div>`;
  else if (rate >= .8) warn = `<div class="warning orange">⚠️ 予算の80%を超えました</div>`;

  document.getElementById('home-budget').innerHTML = `
    <div class="month-lbl">${monthLabel()}</div>
    <div class="remaining-lbl">残り予算</div>
    <div class="remaining-amt ${colorClass(rate)}">${fmt(rem)}</div>
    <div class="prog-track">
      <div class="prog-fill" style="width:${rate*100}%;background:${gradient(rate)}"></div>
    </div>
    <div class="prog-labels">
      <span>使用 ${fmt(spent)}</span>
      <span>予算 ${fmt(S.budget)}</span>
    </div>
    ${warn}
  `;

  // カテゴリ別
  const usedCats = S.categories
    .filter(c => catSpent(c.id) > 0)
    .sort((a,b) => catSpent(b.id) - catSpent(a.id));

  const catsEl = document.getElementById('home-cats');
  if (usedCats.length > 0) {
    catsEl.style.display = 'block';
    catsEl.innerHTML = `<div class="sec-title">カテゴリ別</div>` +
      usedCats.map(c => {
        const sp  = catSpent(c.id);
        const bdg = S.catBudgets?.[c.id] || 0;

        if (bdg > 0) {
          // 予算設定済み：予算に対する進捗を表示
          const r    = Math.min(sp / bdg, 1);
          const over = sp > bdg;
          const barColor = over ? 'var(--red)' : (r >= 0.8 ? 'var(--orange)' : c.color);
          const status = over
            ? `<span style="color:var(--red);font-weight:700">${fmt(sp - bdg)} オーバー</span>`
            : `残り ${fmt(bdg - sp)}`;
          return `
            <div class="cat-row cat-row-budget">
              <div class="cat-icon-sm" style="background:${c.color}22;color:${c.color}">${c.icon}</div>
              <div class="cat-budget-info">
                <div class="cat-budget-top">
                  <span class="cat-name-sm">${c.name}</span>
                  <span class="cat-amount">${fmt(sp)} <span class="cat-bdg-total">/ ${fmt(bdg)}</span></span>
                </div>
                <div class="cat-bar-track">
                  <div class="cat-bar-fill" style="width:${r*100}%;background:${barColor}"></div>
                </div>
                <div class="cat-bdg-status">${status}</div>
              </div>
            </div>`;
        }

        // 予算未設定：従来どおり全体予算比のバー
        const r = S.budget > 0 ? Math.min(sp/S.budget,1) : 0;
        return `
          <div class="cat-row">
            <div class="cat-icon-sm" style="background:${c.color}22;color:${c.color}">${c.icon}</div>
            <div class="cat-name-sm">${c.name}</div>
            <div class="cat-bar-track">
              <div class="cat-bar-fill" style="width:${r*100}%;background:${c.color}"></div>
            </div>
            <div class="cat-amount">${fmt(sp)}</div>
          </div>`;
      }).join('');
  } else {
    catsEl.style.display = 'none';
  }

  // 支出リスト
  const exps = thisMonthExpenses();
  const listEl = document.getElementById('home-list');

  if (exps.length === 0) {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="ei">📭</div>
        <div>まだ支出がありません</div>
        <div style="font-size:13px;margin-top:6px">「追加」タブから入力してみましょう</div>
      </div>`;
  } else {
    listEl.innerHTML = `<div class="expense-list">` + exps.map(e => {
      const c = getCat(e.categoryId);
      const tag = e.isFromReceipt ? `<span class="receipt-tag">📷</span>` : '';
      return `
        <div class="expense-item" onclick="openEditModal('${e.id}')">
          <div class="exp-icon" style="background:${c.color}22;color:${c.color}">${c.icon}</div>
          <div class="exp-info">
            <div class="exp-cat">${c.name}${tag}</div>
            ${e.note ? `<div class="exp-note">${e.note}</div>` : ''}
            <div class="exp-date">${fmtDate(e.date)}</div>
          </div>
          <div class="exp-amt">${fmt(e.amount)}</div>
          <button class="del-btn" onclick="event.stopPropagation();delExpense('${e.id}')">✕</button>
        </div>`;
    }).join('') + `</div>`;
  }
  // みーちゃん更新
  updateMiichan();
}

// カメラ撮影後の処理
document.getElementById('receipt-file').addEventListener('change', async function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  document.getElementById('receipt-preview').innerHTML = `
    <img src="${url}" alt="レシート">
    <div class="proc-overlay" id="proc">
      <div class="spinner"></div>
      <div style="font-size:14px;color:#6b7280;text-align:center">金額を読み取り中…<br><small>少々お待ちください</small></div>
    </div>`;

  document.getElementById('amounts-section').style.display = 'none';
  document.getElementById('receipt-save').style.display    = 'none';

  try {
    const res = await Tesseract.recognize(file, 'jpn+eng', { logger: ()=>{} });
    const amounts = extractAmounts(res.data.text);
    document.getElementById('proc')?.remove();

    if (amounts.length > 0) {
      showAmountChoices(amounts);
    } else {
      document.getElementById('amounts-section').style.display = 'block';
      document.getElementById('amounts-list').innerHTML = `
        <div style="padding:24px;text-align:center;color:#6b7280">
          <div style="font-size:36px;margin-bottom:8px">😅</div>
          <div style="font-weight:700">金額を読み取れませんでした</div>
          <div style="font-size:13px;margin-top:6px">明るい場所で再度撮影するか<br>「追加」タブから手動入力してください</div>
        </div>`;
    }
  } catch(err) {
    document.getElementById('proc')?.remove();
    alert('読み取りに失敗しました。もう一度お試しください。');
  }
  e.target.value = '';
});

function extractAmounts(text) {
  const found = new Set();
  const pats = [
    /合計\s*[¥￥]?\s*([\d,]+)/g,
    /お合計\s*[¥￥]?\s*([\d,]+)/g,
    /小計\s*[¥￥]?\s*([\d,]+)/g,
    /[¥￥]\s*([\d,]+)/g,
    /([\d,]+)\s*円/g,
  ];
  pats.forEach(p => {
    const re = new RegExp(p.source, 'g');
    let m;
    while ((m = re.exec(text)) !== null) {
      const n = parseInt(m[1].replace(/,/g,''), 10);
      if (n >= 10 && n < 1_000_000) found.add(n);
    }
  });
  return [...found].sort((a,b) => b-a).slice(0,8);
}

/* ==================================================
   履歴・分析
================================================== */
let historyYear  = new Date().getFullYear();
let historyMonth = new Date().getMonth();

function historyPrevMonth() {
  historyMonth--;
  if (historyMonth < 0) { historyMonth = 11; historyYear--; }
  renderHistory();
}
function historyNextMonth() {
  const now = new Date();
  if (historyYear === now.getFullYear() && historyMonth === now.getMonth()) return;
  historyMonth++;
  if (historyMonth > 11) { historyMonth = 0; historyYear++; }
  renderHistory();
}

function getMonthExpenses(year, month) {
  return S.expenses.filter(e => {
    const d = new Date(e.date);
    return d.getFullYear() === year && d.getMonth() === month;
  });
}

function renderHistory() {
  const now = new Date();
  document.getElementById('history-month-label').textContent =
    `${historyYear}年${historyMonth + 1}月`;
  const nextBtn = document.getElementById('history-next-btn');
  nextBtn.disabled = historyYear === now.getFullYear() && historyMonth === now.getMonth();

  const exps  = getMonthExpenses(historyYear, historyMonth);
  const total = exps.reduce((s, e) => s + e.amount, 0);

  document.getElementById('history-summary').innerHTML = `
    <div class="history-summary-total">${fmt(total)}</div>
    <div class="history-summary-sub">${historyYear}年${historyMonth + 1}月の合計支出 / 全${exps.length}件</div>`;

  const bycat = {};
  exps.forEach(e => { bycat[e.categoryId] = (bycat[e.categoryId] || 0) + e.amount; });
  const maxAmt = Math.max(...Object.values(bycat), 1);
  const rows = S.categories
    .filter(c => bycat[c.id])
    .sort((a, b) => (bycat[b.id] || 0) - (bycat[a.id] || 0))
    .map(c => {
      const amt    = bycat[c.id] || 0;
      const catBdg = S.catBudgets[c.id] || 0;
      const pct    = Math.round(amt / maxAmt * 100);
      const over   = catBdg > 0 && amt > catBdg;
      const bdgStr = catBdg > 0
        ? `予算 ${fmt(catBdg)}　<span class="${over ? 'cat-budget-over' : ''}">${over ? '⚠️ '+fmt(amt-catBdg)+' オーバー' : '残り '+fmt(catBdg-amt)}</span>`
        : '';
      return `
        <div class="cat-breakdown-row">
          <div class="cat-breakdown-top">
            <div class="cat-breakdown-icon" style="background:${c.color}22;color:${c.color}">${c.icon}</div>
            <div class="cat-breakdown-name">${c.name}</div>
            <div class="cat-breakdown-amt">${fmt(amt)}</div>
          </div>
          <div class="cat-breakdown-bar-wrap">
            <div class="cat-breakdown-bar" style="width:${pct}%;background:${c.color}"></div>
          </div>
          ${bdgStr ? `<div class="cat-breakdown-budget">${bdgStr}</div>` : ''}
        </div>`;
    }).join('');
  document.getElementById('history-cat-breakdown').innerHTML =
    rows || '<div style="text-align:center;color:var(--text2);padding:20px">支出なし</div>';

  if (exps.length === 0) {
    document.getElementById('history-list').innerHTML =
      '<div class="empty-state">この月の支出はありません</div>';
    return;
  }
  const sorted = [...exps].sort((a, b) => new Date(b.date) - new Date(a.date));
  document.getElementById('history-list').innerHTML =
    `<div class="expense-list">` + sorted.map(e => {
      const c = getCat(e.categoryId);
      return `
        <div class="expense-item" onclick="openEditModal('${e.id}')">
          <div class="exp-icon" style="background:${c.color}22;color:${c.color}">${c.icon}</div>
          <div class="exp-info">
            <div class="exp-cat">${c.name}</div>
            ${e.note ? `<div class="exp-note">${e.note}</div>` : ''}
            <div class="exp-date">${fmtDate(e.date)}</div>
          </div>
          <div class="exp-amt">${fmt(e.amount)}</div>
          <button class="del-btn" onclick="event.stopPropagation();delExpense('${e.id}')">✕</button>
        </div>`;
    }).join('') + `</div>`;
}

   カテゴリ別予算
================================================== */
function renderCatBudgets() {
  document.getElementById('s-cat-budget-list').innerHTML =
    S.categories.map(c => `
      <div class="cat-budget-row">
        <div class="cat-budget-icon" style="background:${c.color}22;color:${c.color}">${c.icon}</div>
        <div class="cat-budget-name">${c.name}</div>
        <div style="display:flex;align-items:center;gap:4px">
          <span style="font-size:13px;color:var(--text2)">¥</span>
          <input class="cat-budget-input" type="number" inputmode="numeric" min="0"
            id="catbdg-${c.id}" placeholder="未設定"
            value="${S.catBudgets[c.id] || ''}"
            oninput="updateCatBudgetSum()">
        </div>
      </div>`).join('');
  updateCatBudgetSum();
}

function updateCatBudgetSum() {
  let sum = 0;
  S.categories.forEach(c => {
    const v = parseInt(document.getElementById('catbdg-' + c.id)?.value || '0');
    if (v > 0) sum += v;
  });
  const el = document.getElementById('cat-budget-sum');
  if (!el) return;
  const diff = S.budget - sum;
  if (sum === 0) {
    el.innerHTML = `<span style="color:var(--text2)">カテゴリ予算を設定すると、全体予算 ${fmt(S.budget)} の内訳を管理できます</span>`;
  } else if (diff >= 0) {
    el.innerHTML = `カテゴリ予算合計 <b>${fmt(sum)}</b> ／ 全体予算 ${fmt(S.budget)}<br>
      <span style="color:var(--green);font-weight:700">残り ${fmt(diff)} が未割り当てです</span>`;
  } else {
    el.innerHTML = `カテゴリ予算合計 <b>${fmt(sum)}</b> ／ 全体予算 ${fmt(S.budget)}<br>
      <span style="color:var(--red);font-weight:700">⚠️ 全体予算を ${fmt(-diff)} 超えています</span>`;
  }
}

async function saveCatBudgets() {
  S.catBudgets = {};
  S.categories.forEach(c => {
    const v = parseInt(document.getElementById('catbdg-' + c.id)?.value || '0');
    if (v > 0) S.catBudgets[c.id] = v;
  });
  await save();
  toast('✅ カテゴリ予算を保存しました！');
}

================================================== */
const MII_GREAT   = ['いい調子！✨', 'すごい！節約上手！', 'この調子だよ〜！🎵', 'ファビュラス！💕', 'みーちゃんも嬉しい！'];
const MII_CAUTION = ['ちょっと使いすぎかも…', '予算の半分超えたよ！', 'そろそろペース落とそっか？', 'ちょっと心配だよ〜'];
const MII_DANGER  = ['みーちゃん心配…', 'もうすぐ予算オーバーだよ！', 'ちょっと待って！！', 'そろそろ本気で節約…！'];
const MII_OVER    = ['節約する気ある？😾', '予算オーバーだよ！😱', 'やりすぎ〜！！😾', '来月はがんばろ…', 'ちょっと、使いすぎ！'];
const miiCatOver  = n => [`${n}の出費が多いかも！`, `${n}、使いすぎてない？`, `${n}に集中しすぎ〜！`];

let miiBubbleTimer = null;

function getMiiComment() {
  const rate = usageRate();
  const exps = thisMonthExpenses();
  const bycat = {};
  exps.forEach(e => { bycat[e.categoryId] = (bycat[e.categoryId] || 0) + e.amount; });
  const overCat = S.categories.find(c => S.catBudgets[c.id] && bycat[c.id] > S.catBudgets[c.id]);
  let pool;
  if (overCat && rate > 0.5) pool = miiCatOver(overCat.name);
  else if (rate >= 1)        pool = MII_OVER;
  else if (rate >= 0.8)      pool = MII_DANGER;
  else if (rate >= 0.5)      pool = MII_CAUTION;
  else                       pool = MII_GREAT;
  return pool[Math.floor(Math.random() * pool.length)];
}

function showMiiBubble(msg) {
  const el = document.getElementById('miichan-bubble');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(miiBubbleTimer);
  miiBubbleTimer = setTimeout(() => el.classList.remove('show'), 4500);
}

function miichanTap() {
  const svg = document.getElementById('miichan-svg');
  svg.classList.remove('bounce');
  void svg.offsetWidth;
  svg.classList.add('bounce');
  showMiiBubble(getMiiComment());
  setTimeout(() => svg.classList.remove('bounce'), 500);
}

function updateMiichan() {
  clearTimeout(miiBubbleTimer);
  setTimeout(() => showMiiBubble(getMiiComment()), 1800);
}

/* ==================================================
   トースト
================================================== */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

/* ==================================================
   Firebase Auth & 初期化
================================================== */
function loginWithGoogle() {
  window._signInWithPopup(window._auth, window._provider).catch(err => {
    alert('ログインに失敗しました: ' + err.message);
  });
}

function logout() {
  if (!confirm('ログアウトしますか？')) return;
  window._signOut(window._auth);
}

function renderNavUser(user) {
  const el = document.getElementById('nav-user');
  if (!el) return;
  if (user.photoURL) {
    el.innerHTML = `
      <img class="user-avatar" src="${user.photoURL}" alt="${user.displayName}">
      <button class="logout-btn" onclick="logout()">ログアウト</button>`;
  } else {
    const initial = (user.displayName || user.email || '?')[0].toUpperCase();
    el.innerHTML = `
      <div class="user-avatar-ph">${initial}</div>
      <button class="logout-btn" onclick="logout()">ログアウト</button>`;
  }
}

// Firebase SDK 読み込み後に Auth 監視を開始
function initAuth() {
  if (!window._onAuthStateChanged) {
    setTimeout(initAuth, 100);
    return;
  }
  window._onAuthStateChanged(window._auth, async user => {
    if (user) {
      // ログイン済み
      currentUser = user;
      document.getElementById('login-screen').classList.remove('show');
      // ローディング表示
      document.getElementById('home-list').innerHTML =
        `<div class="empty-state"><div class="spinner" style="margin:0 auto"></div></div>`;
      await load();
      renderNavUser(user);
      renderHome();
    } else {
      // 未ログイン
      currentUser = null;
      document.getElementById('login-screen').classList.add('show');
    }
  });
}

initAuth();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
